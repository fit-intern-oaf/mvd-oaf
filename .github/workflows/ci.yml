name: CI
on:
  push:
    branches: [main]
  pull_request:

# No workflow-level permissions block.
# Each job declares exactly what its called reusable workflow needs.

jobs:
  lint:
    permissions:
      contents: read
    uses: fit-intern-oaf/.github/.github/workflows/reusable-lint.yml@main

  reuse:
    permissions:
      contents: read
    uses: fit-intern-oaf/.github/.github/workflows/reusable-reuse-check.yml@main

  test:
    permissions:
      contents: read
    uses: fit-intern-oaf/.github/.github/workflows/reusable-unit-test.yml@main
    with:
      has-python: false
      has-node: false
      # MVD is JVM/Gradle. Add a JVM reusable workflow in Phase 2 — for now
      # upstream Gradle wrapper handles the build locally.

  trivy-fs:
    permissions:
      contents: read
      security-events: write
    uses: fit-intern-oaf/.github/.github/workflows/reusable-trivy-scan.yml@main
    with:
      # Advisory mode: upstream MVD reference impl ships known HIGH/CRITICAL CVEs
      # in its Gradle deps. Catalogue them, don't block CI yet. Tighten to "1"
      # once we triage and either upgrade deps or add a .trivyignore.
      exit-code: "0"

  # Preflight: detect optional-stage artefacts. hashFiles() cannot be used in a
  # job-level if: on reusable-workflow callers (no runner at orchestration time),
  # so we evaluate on a real runner here and gate downstream jobs on the output.
  # MVD has 4 Dockerfiles under launchers/*/src/main/docker/ but no root one;
  # Phase 2 will add a matrix build over all 4 launchers.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has-dockerfile: ${{ steps.detect.outputs.has-dockerfile }}
      has-releaserc: ${{ steps.detect.outputs.has-releaserc }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "has-dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
          if ls .releaserc* package.json 2>/dev/null | grep -q .; then
            echo "has-releaserc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-releaserc=false" >> "$GITHUB_OUTPUT"
          fi

  container:
    needs: [lint, reuse, preflight]
    # Skip until a root Dockerfile exists OR until Phase 2 adds a per-launcher
    # matrix build in this workflow directly (reusable-container-build.yml
    # assumes a single root Dockerfile).
    if: needs.preflight.outputs.has-dockerfile == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fit-intern-oaf/.github/.github/workflows/reusable-container-build.yml@main
    with:
      image-name: mvd-oaf
      push: true

  release:
    needs: [container, preflight]
    if: needs.preflight.outputs.has-releaserc == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: fit-intern-oaf/.github/.github/workflows/reusable-semantic-release.yml@main
    with:
      zenodo-enabled: true
    secrets:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
