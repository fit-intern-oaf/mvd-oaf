name: Upstream sync
on:
  schedule:
    - cron: '0 5 * * 1'   # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/eclipse-dataspace-hub/MinimumViableDataspace.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "openaiflex-bot"
          git config user.email "bot@openaiflex.eu"

      - name: Add upstream remote
        run: |
          git remote add upstream "${UPSTREAM_URL}" || true
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Fast-forward upstream branch (strip upstream workflows)
        # GITHUB_TOKEN cannot create/update files under .github/workflows/ even
        # with contents:write — a well-known GitHub limitation. We don't want
        # upstream CI running in our fork anyway; our own ci.yml is authoritative.
        run: |
          git checkout -B "${TARGET_BRANCH}" "upstream/${UPSTREAM_BRANCH}"
          if [ -d .github/workflows ]; then
            git rm -rf .github/workflows
            git commit -m "chore(sync): strip upstream workflows (fit-intern-oaf uses its own CI)"
          fi
          git push origin "${TARGET_BRANCH}" --force-with-lease

      - name: Open PR from upstream → main (if delta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count "origin/main..${TARGET_BRANCH}")
          if [ "$AHEAD" -eq "0" ]; then
            echo "No new upstream commits. Nothing to do."
            exit 0
          fi
          EXISTING=$(gh pr list --head "${TARGET_BRANCH}" --base main --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Existing PR #$EXISTING already open — branch already updated."
            exit 0
          fi
          # Attempt automated PR creation. If the org blocks "Actions create PRs",
          # fall back to printing the manual URL and succeed anyway.
          if ! gh pr create \
                --head "${TARGET_BRANCH}" \
                --base main \
                --title "chore(upstream): weekly sync from MinimumViableDataspace" \
                --body "Automated weekly sync. $AHEAD commits ahead. Review for conflicts and OpenAIFlex-specific regressions before merging." 2>&1 | tee /tmp/pr.log; then
            if grep -q "Resource not accessible" /tmp/pr.log; then
              echo "::warning::PR creation blocked by org setting 'Allow GitHub Actions to create and approve pull requests'. Branch is pushed — open manually:"
              echo "::warning::https://github.com/${{ github.repository }}/pull/new/${TARGET_BRANCH}"
              exit 0
            fi
            exit 1
          fi
